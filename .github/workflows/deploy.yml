name: Laravel Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: erpgarment-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy Laravel
        shell: bash
        run: |
          set -euo pipefail
          cd /var/www/html/erpgarment

          echo "=== UPDATE SOURCE ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== INSTALL DEPENDENCIES ==="
          composer install --no-dev --optimize-autoloader --no-interaction

          echo "=== CLEAR CACHE ==="
          php artisan optimize:clear

          echo "=== CACHE CONFIG ==="
          php artisan config:cache

          echo "=== CACHE ROUTE ==="
          php artisan route:cache

          echo "=== CACHE VIEW ==="
          php artisan view:cache

          echo "=== DEPLOY SUCCESS ==="
