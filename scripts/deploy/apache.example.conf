# Ubuntu 22.04 + Apache 2.4. Replace erp.example.com with the real domain.
# Install certificates first, or adapt the SSL block to the existing TLS virtual host.
# Never use /var/www/html/erpgarment itself as DocumentRoot.
<VirtualHost *:80>
    ServerName erp.example.com
    DocumentRoot /var/www/html/erpgarment/current/public
    Redirect permanent / https://erp.example.com/
    ErrorLog ${APACHE_LOG_DIR}/erpgarment-error.log
    CustomLog ${APACHE_LOG_DIR}/erpgarment-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName erp.example.com
    DocumentRoot /var/www/html/erpgarment/current/public
    DirectoryIndex index.php

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/erp.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/erp.example.com/privkey.pem

    # Deny application source, old checkout, shared .env and private storage.
    <Directory /var/www/html/erpgarment>
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/erpgarment/current/public>
        Options +FollowSymLinks -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Apache may resolve current to the real release path.
    <Directory "/var/www/html/erpgarment/releases/*/public">
        Options +FollowSymLinks -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/erpgarment/shared/storage/app/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Uploaded files must never run as PHP.
        <FilesMatch "\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # PHP handler is intentionally not forced here.
    # FPM: enable the installed php8.4-fpm Apache configuration.
    # mod_php: retain the existing PHP 8.4 Apache module.
    ErrorLog ${APACHE_LOG_DIR}/erpgarment-error.log
    CustomLog ${APACHE_LOG_DIR}/erpgarment-access.log combined
</VirtualHost>
